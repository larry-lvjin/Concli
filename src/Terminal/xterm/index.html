<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!-- Strict on purpose: no inline script (boot.js is a real file), no network of any kind. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
<link rel="stylesheet" href="xterm.css" />
<style>
  /* Startup values only — ptyHost.setTheme overwrites these custom properties
     from TerminalTheme.cs, which is the single source of truth for terminal colour. */
  :root { --scroll-track: #0C0C0C; --scroll-thumb: #767676; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0C0C0C;
  }
  #term { width: 100%; height: 100%; padding: 8px; box-sizing: border-box; }
  .xterm-viewport::-webkit-scrollbar { width: 10px; }
  .xterm-viewport::-webkit-scrollbar-track { background: var(--scroll-track); }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border-radius: 5px;
    border: 2px solid var(--scroll-track); opacity: 0.6;
  }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="boot.js"></script>
</body>
</html>
